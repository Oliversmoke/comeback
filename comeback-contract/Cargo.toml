[workspace]
members = [
    "goal-staking",
    "group-escrow",
    "milestone"
]
resolver = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"

[profile.release-with-logs]
inherits = "release"
debug = true
strip = false
