# Single-server deployment: one container serves the pages, API and websocket.
# Usage:
#   docker compose -f docker-compose.unified.yml up --build
#
# Provide secrets via environment (e.g. MONGODB_URI, JWT_SECRET, OPENAI_API_KEY).
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.unified
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      UNIFIED_SERVER: "true"
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/comeback}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongodata:
